<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<title>Dashboards — Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; min-height: 100vh; font-family: "Plus Jakarta Sans", "Hind Siliguri", sans-serif; background: radial-gradient(1400px 700px at 50% 0%, #eef0ff, #f5f6fa 60%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 26px 0; }
  h1 { margin: 0; font-size: 21px; color: #0f172a; letter-spacing: -.02em; }
  h1 span { color: #64748b; font-weight: 500; font-size: 14px; margin-left: 8px; }
  .row { display: flex; gap: 30px; }
  .phone { box-sizing: border-box; width: 330px; height: 690px; border-radius: 48px; padding: 11px; background: #0b1020; box-shadow: 0 36px 70px rgba(15,23,42,.25), inset 0 0 0 2px #2b3150; position: relative; }
  .phone::after { content: ""; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 96px; height: 27px; border-radius: 18px; background: #0b1020; z-index: 2; }
  iframe { width: 308px; height: 668px; border: 0; border-radius: 38px; background: #fff; display: block; }
  .cap { text-align: center; margin-top: 12px; font-weight: 700; color: #334155; font-size: 14px; }
  .cap i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>
  <h1 id="title">Dashboards — Mobile <span>bottom tab bar · one-hand use</span></h1>
  <div class="row" id="row"></div>
<script>
  const q = new URLSearchParams(location.search);
  const off = q.get("offline") ? "?offline=1" : "";
  if (off) document.getElementById("title").innerHTML = 'Offline mode <span>internet chara o sob dekha jai, kaj kora jai</span>';
  const roles = (q.get("roles") || "student,guardian,teacher,admin").split(",");
  const meta = { student: ["Student", "#5b4cf0"], guardian: ["Guardian", "#0e9f8e"], teacher: ["Teacher (Gonit)", "#e07a12"], admin: ["Admin", "#3f3bd9"] };
  document.getElementById("row").innerHTML = roles.map(r =>
    `<div><div class="phone"><iframe src="${r}.html${off}"></iframe></div><div class="cap"><i style="background:${meta[r][1]}"></i>${meta[r][0]}</div></div>`).join("");
</script>
</body>
</html>
